<style>
body{margin:0;background:#0b1220;color:#e2e8f0;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;line-height:1.8}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
a{color:#fbbf24;text-decoration:none}
nav{padding:14px 16px;background:#16213a;border-bottom:1px solid #24344f;text-align:center}
nav a{font-weight:bold}
h1{font-size:1.4em;color:#fbbf24}
h2{font-size:1.05em;color:#fbbf24;margin:18px 0 8px}
input{width:100%;box-sizing:border-box;background:#0b1220;border:1px solid #24344f;border-radius:10px;color:#e2e8f0;padding:10px 14px;font-family:inherit;font-size:1em;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.grid a{display:block;background:#16213a;border:1px solid #24344f;border-radius:12px;padding:12px 10px;text-align:center;font-weight:700}
.grid a small{display:block;font-weight:400;opacity:.65;font-size:.78em;margin-top:3px}
.grid a:hover{border-color:#fbbf24}
.empty{opacity:.6;font-size:.88em;padding:6px 0}
</style>
</head>
<body>
<nav><a href="https://andrew101018.github.io/EDGE/">Edge Football ⚽ الصفحة الرئيسية</a></nav>
<main>
<h1>دليل اللاعبين</h1>
<p style="opacity:.75;font-size:.9em;">قوائم الهدافين وصناع اللعب الحالية على الموقع. اللاعب اللي صفحته جاهزة اسمه لينك نشط — والباقي لسه بيتجهز.</p>
<input id="q" type="search" placeholder="ابحث باسم اللاعب أو الفريق..." oninput="render()">
<div id="list"></div>
</main>
<script>
const KNOWN = {"erling haaland": "erling-haaland", "kylian mbappé": "kylian-mbappe"};
const norm = s => (s || '').trim().replace(/[أإآ]/g, 'ا').toLowerCase();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ALL = [];
(async () => {
  try {
    const r = await fetch('../site/data.json?t=' + Date.now(), { cache: 'no-store' });
    const d = await r.json();
    const seen = {};
    for (const [league, cats] of Object.entries(d.leaders || {}))
      for (const [label, items] of Object.entries(cats || {}))
        (items || []).forEach(p => {
          const k = norm(p.name);
          if (!k || seen[k]) return;
          seen[k] = 1;
          ALL.push({ name: p.name, team: p.team || '', value: p.value || '', league, label });
        });
  } catch (e) {}
  render();
})();
function render() {
  const q = norm(document.getElementById('q').value);
  const items = ALL.filter(p => !q || norm(p.name).includes(q) || norm(p.team).includes(q));
  const el = document.getElementById('list');
  if (!items.length) { el.innerHTML = '<p class="empty">مفيش لاعب بالاسم ده في القوائم الحالية 🔍</p>'; return; }
  const groups = {};
  items.forEach(p => { (groups[p.league] = groups[p.league] || []).push(p); });
  el.innerHTML = Object.entries(groups).map(([league, ps]) =>
    `<h2>${esc(league)}</h2><div class="grid">` + ps.map(p => {
      const slug = KNOWN[norm(p.name)];
      const inner = `${esc(p.name)}<small>${esc(p.team)} · ${esc(p.value)}</small>`;
      return slug ? `<a href="${slug}.html">${inner}</a>` : `<a style="opacity:.55;cursor:default" onclick="return false">${inner}<small style="color:#94a3b8">الصفحة لسه مش جاهزة</small></a>`;
    }).join('') + '</div>').join('');
}
</script>
</body>
</html>

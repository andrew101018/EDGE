<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edge Football ⚽</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="container">
    <h1>⚽ Edge Football</h1>
    <p class="subtitle">أخبار كورة عالمية بلمسة مصرية</p>
    <div class="last-update" id="lastUpdate"></div>
  </div>
</header>

<main class="container">

  <section id="liveSection" class="section live-section" style="display:none;">
    <h2>🔴 مباريات لايف</h2>
    <div id="liveContainer" class="grid"></div>
  </section>

  <section class="section">
    <h2>📰 آخر الأخبار</h2>
    <div id="newsContainer" class="list"></div>
  </section>

  <section class="section">
    <h2>🏁 نتائج اليوم</h2>
    <div id="resultsContainer" class="list"></div>
  </section>

  <section class="section">
    <h2>📅 مباريات اليوم</h2>
    <div id="scheduleContainer" class="list"></div>
  </section>

  <section class="section">
    <h2>🏆 ترتيب الدوريات</h2>
    <div id="tablesContainer" class="grid"></div>
  </section>

  <section class="section telegram">
    <h2>📢 تابعنا على تيليجرام</h2>
    <p>كل الأخبار والنتائج والفيديوهات لحظياً على قناتنا</p>
    <a href="https://t.me/edgefootballplatform" target="_blank" rel="noopener" class="btn">انضم للقناة الآن</a>
  </section>

</main>

<footer>
  <div class="container">
    <p>© 2026 Edge Football — منصة كورة ذكية تعمل بالذكاء الاصطناعي</p>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>

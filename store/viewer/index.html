<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDGE Store 3D</title><style>html,body{margin:0;height:100%;background:#0a0a0a;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
#ui{position:fixed;bottom:14px;left:0;right:0;text-align:center}.sw{display:inline-block;width:34px;height:34px;border-radius:50%;margin:4px;border:2px solid #555;cursor:pointer}
.sw.on{border-color:#ff8a1f}#t{position:fixed;top:12px;left:0;right:0;text-align:center;font:700 22px Impact,sans-serif;color:#ff8a1f}#h{position:fixed;top:44px;left:0;right:0;text-align:center;font-size:12px;opacity:.6}</style></head><body>
<div id="t">EDGE STORE</div><div id="h">Drag to rotate, pinch or scroll to zoom</div><div id="ui"></div>
<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from './OrbitControls.js';
const q=new URLSearchParams(location.search),id=q.get('d')||'dragon',kind=q.get('k')||'tee';
document.getElementById('t').textContent=(q.get('n')||'EDGE STORE');
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0x0a0a0a);const c=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);c.position.set(0,0,12.5);
s.add(new THREE.HemisphereLight(0xffffff,0x332211,1.1));const dl=new THREE.DirectionalLight(0xffb070,1.6);dl.position.set(3,4,6);s.add(dl);const dl2=new THREE.DirectionalLight(0xffffff,.8);dl2.position.set(-4,2,-6);s.add(dl2);
// tee outline
const sh=new THREE.Shape(),P=[[-1.1,2.1],[-.45,2.1],[-.3,1.8],[.3,1.8],[.45,2.1],[1.1,2.1],[2.3,1.2],[1.8,.35],[1.15,.7],[1.15,-2.2],[-1.15,-2.2],[-1.15,.7],[-1.8,.35],[-2.3,1.2]];
sh.moveTo(...P[0]);P.slice(1).forEach(p=>sh.lineTo(...p));sh.closePath();
if(kind==='hoodie'){}
const g=new THREE.ExtrudeGeometry(sh,{depth:.5,bevelEnabled:true,bevelSize:.12,bevelThickness:.14,bevelSegments:6,curveSegments:8});g.translate(0,0,-.25);
const mat=new THREE.MeshStandardMaterial({color:0x111111,roughness:.9});const body=new THREE.Mesh(g,mat);
const grp=new THREE.Group();grp.add(body);
const tex=new THREE.TextureLoader().load('tex/'+id+'.png');tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=8;
const pm=new THREE.MeshBasicMaterial({map:tex,transparent:true});
const back=new THREE.Mesh(new THREE.PlaneGeometry(1.9,2.28),pm);back.position.set(0,-.15,-.42);back.rotation.y=Math.PI;grp.add(back);
// neck hole ring
const neck=new THREE.Mesh(new THREE.TorusGeometry(.4,.05,8,24,Math.PI),new THREE.MeshStandardMaterial({color:0x080808}));neck.rotation.z=Math.PI;neck.position.set(0,1.8,.3);grp.add(neck);
s.add(grp);grp.rotation.y=Math.PI*0.88;
const cols={Black:0x111111,Blue:0x12318f,Green:0x0f4d2c};
const ui=document.getElementById('ui');Object.entries(cols).forEach(([n,h],i)=>{const e=document.createElement('span');e.className='sw'+(i?'':' on');e.style.background='#'+h.toString(16).padStart(6,'0');e.title=n;e.onclick=()=>{mat.color.setHex(h);document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));e.classList.add('on')};ui.appendChild(e)});
const o=new OrbitControls(c,r.domElement);o.enableDamping=true;o.enablePan=false;o.minDistance=8;o.maxDistance=18;o.autoRotate=!q.get('still');o.autoRotateSpeed=2;
addEventListener('pointerdown',()=>o.autoRotate=false);
addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix()});
(function a(){requestAnimationFrame(a);o.update();r.render(s,c)})();
</script></body></html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الكورة المصرية: الدوري المصري ومنتخب مصر | Edge Football</title>
<meta name="description" content="مباريات الدوري المصري ومنتخب مصر وآخر الأخبار المصرية — بتوقيت القاهرة على Edge Football">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/andrew101018/EDGE@main/photo_2024-09-05_19-57-28.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=8">
<style>
.eg-empty { background:#16213a; border-right:4px solid #64748b; border-radius:8px; padding:14px; color:#94a3b8; font-size:.9em; margin-bottom:16px; }
.eg-stamp { color:#64748b; font-size:.8em; margin:-6px 0 16px; }
.eg-mcard { background:#16213a; border-right:4px solid #22c55e; border-radius:8px; padding:12px 14px; margin-bottom:10px; }
.eg-teams { display:flex; align-items:center; justify-content:space-between; gap:8px; font-weight:bold; }
.eg-team { display:flex; align-items:center; gap:8px; min-width:0; }
.eg-team img { width:26px; height:26px; object-fit:contain; flex:0 0 auto; }
.eg-vs { color:#64748b; font-size:.8em; flex:0 0 auto; }
.eg-meta { color:#94a3b8; font-size:.82em; margin-top:6px; }
.eg-score { color:#fbbf24; font-weight:bold; }
.eg-live { color:#4ade80; font-weight:bold; }
</style>
</head>
<body>
<nav><a href="https://andrew101018.github.io/EDGE/">Edge Football ⚽ الصفحة الرئيسية</a></nav>
<main class="container">
  <h1 style="color:#ef4444;">🇪🇬 الكورة المصرية</h1>
  <p class="eg-stamp" id="egStamp">جاري تحميل البيانات…</p>

  <h2>🇪🇬 منتخب مصر</h2>
  <div id="ntBox"><div class="eg-empty">جاري التحميل…</div></div>

  <h2>🏆 الدوري المصري</h2>
  <div id="leagueBox"><div class="eg-empty">جاري التحميل…</div></div>

  <h2>📰 أخبار مصرية</h2>
  <div id="newsBox"><div class="eg-empty">جاري التحميل…</div></div>
</main>
<script>
(function () {
  'use strict';
  var KW = /مصر|صلاح|مرموش|منتخب|الفراعنة|الأهلي|الزمالك/;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function teamImg(logo) { return logo ? '<img src="' + esc(logo) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : ''; }
  function fmtTime(iso, fallback) {
    try {
      var d = new Date(iso);
      return d.toLocaleTimeString('ar-EG', { timeZone: 'Africa/Cairo', hour: 'numeric', minute: '2-digit' });
    } catch (e) { return fallback || ''; }
  }
  function matchCard(m) {
    var score = '';
    if (m.state === 'post' || m.detail === 'FT') score = '<span class="eg-score">' + esc(m.hs) + ' - ' + esc(m.as) + '</span>';
    else if (m.state === 'in' || m.state === 'live') score = '<span class="eg-live">مباشر 🔴</span>';
    else score = '<span class="eg-vs">VS</span>';
    var meta = esc(m.dateAr || '') + (m.state === 'pre' ? ' · ' + esc(fmtTime(m.date, m.time)) : '') + (m.detail && m.state !== 'pre' ? ' · ' + esc(m.detail) : '');
    return '<div class="eg-mcard"><div class="eg-teams">' +
      '<span class="eg-team">' + teamImg(m.homeLogo) + esc(m.home) + '</span>' + score +
      '<span class="eg-team">' + esc(m.away) + teamImg(m.awayLogo) + '</span></div>' +
      '<div class="eg-meta">' + meta + '</div></div>';
  }
  function fill(box, cards, emptyText) {
    box.innerHTML = cards.length ? cards.join('') : '<div class="eg-empty">' + emptyText + '</div>';
  }
  /* منتخب مصر: ESPN public team schedule (team 2620), fetched live on page open. */
  var NT_APIS = [
    ['تصفيات كأس الأمم الأفريقية 2027', 'https://site.api.espn.com/apis/site/v2/sports/soccer/caf.nations_qual/teams/2620/schedule'],
    ['مباريات ودية', 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.friendly/teams/2620/schedule'],
    ['كأس العالم 2026', 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/teams/2620/schedule']
  ];
  function fmtDayCairo(iso) {
    try {
      return new Date(iso).toLocaleDateString('ar-EG', { timeZone: 'Africa/Cairo', day: 'numeric', month: 'long', year: 'numeric' });
    } catch (e) { return ''; }
  }
  function ntCard(ev, comp) {
    var c = (ev.competitions && ev.competitions[0]) || {};
    var comps = c.competitors || [];
    var home = comps.filter(function (x) { return x.homeAway === 'home'; })[0] || {};
    var away = comps.filter(function (x) { return x.homeAway === 'away'; })[0] || {};
    var hn = (home.team && (home.team.displayName || home.team.name)) || '?';
    var an = (away.team && (away.team.displayName || away.team.name)) || '?';
    var st = (c.status && c.status.type) || {};
    var mid;
    if (st.completed || st.state === 'post') {
      mid = '<span class="eg-score">' + esc(home.score && home.score.value) + ' - ' + esc(away.score && away.score.value) + '</span>';
    } else {
      var d = new Date(ev.date);
      var midnight = d.getUTCHours() === 0 && d.getUTCMinutes() === 0;
      mid = '<span class="eg-vs">' + (midnight ? 'الموعد لسه متحدد' : esc(fmtTime(ev.date))) + '</span>';
    }
    return '<div class="eg-mcard" style="border-right-color:#3b82f6;"><div class="eg-teams">' +
      '<span class="eg-team">' + esc(hn) + '</span>' + mid + '<span class="eg-team">' + esc(an) + '</span></div>' +
      '<div class="eg-meta">' + esc(comp) + ' · ' + esc(fmtDayCairo(ev.date)) + '</div></div>';
  }
  function loadNT() {
    var box = document.getElementById('ntBox');
    Promise.all(NT_APIS.map(function (a) {
      return fetch(a[1], { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) { return { comp: a[0], events: (j && j.events) || [] }; })
        .catch(function () { return { comp: a[0], events: [] }; });
    })).then(function (sets) {
      var all = [];
      sets.forEach(function (s) { s.events.forEach(function (e) { e.__comp = s.comp; all.push(e); }); });
      var now = Date.now();
      var upcoming = all.filter(function (e) { return new Date(e.date) > now; }).sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
      var played = all.filter(function (e) {
        var st = (e.competitions && e.competitions[0] && e.competitions[0].status && e.competitions[0].status.type) || {};
        return (st.completed || st.state === 'post') && new Date(e.date) <= now;
      }).sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
      var cards = upcoming.slice(0, 3).map(function (e) { return ntCard(e, e.__comp); });
      if (!upcoming.length) {
        /* ESPN schedule API has no dated upcoming NT fixture yet; next window verified on ESPN's fixtures page. Self-heals once the API lists fixtures. */
        cards.push('<div class="eg-mcard" style="border-right-color:#f59e0b;"><div class="eg-meta" style="margin-top:0;line-height:1.9;">أقرب ماتشات جاية للمنتخب حسب جدول ESPN: أنجولا × مصر (24 مارس 2027) ومصر × جنوب السودان (28 مارس 2027) — المواعيد بالتوقيت لسه متحددة.<br>المصدر: ESPN · آخر مراجعة 25 نوفمبر 2026</div></div>');
      }
      cards = cards.concat(played.slice(0, 4).map(function (e) { return ntCard(e, e.__comp); }));
      if (cards.length) {
        cards.push('<div class="eg-stamp" style="margin:8px 0 0;">المصدر: ESPN · بيجي بالبيانات لحظة فتح الصفحة</div>');
        box.innerHTML = cards.join('');
      } else {
        box.innerHTML = '<div class="eg-empty">مفيش مباريات لمنتخب مصر في البيانات الحالية — أول ما ماتش للمنتخب ينزل في المصادر هيظهر هنا تلقائيًا.</div>';
      }
    });
  }
  fetch('site/data.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!d) throw 0;
      document.getElementById('egStamp').textContent = 'المواعيد بتوقيت القاهرة · البيانات كما في آخر تحديث: ' + (d.matches_updated_at || d.updated_at || '—');
      var groups = d.matches || [];
      var nt = [], league = [];
      groups.forEach(function (g) {
        (g.items || []).forEach(function (m) {
          var isNT = (m.home === 'مصر' || m.away === 'مصر' || /(^|\s)Egypt(\s|$)/.test(m.home || '') || /(^|\s)Egypt(\s|$)/.test(m.away || ''));
          if (g.slug === 'egy.1') league.push(m);
          else if (isNT) nt.push(m);
        });
      });
      /* NT section always uses ESPN's team schedule (fixtures + results); the feed rarely carries NT matches. */
      loadNT();
      fill(document.getElementById('leagueBox'), league.map(matchCard), 'مفيش مباريات دوري مصري في البيانات الحالية.');
      var news = (d.news || []).filter(function (n) { return KW.test((n.title || '') + ' ' + (n.summary || '')); });
      fill(document.getElementById('newsBox'), news.map(function (n) {
        var u = n.url || n.link || '';
        var inner = '<div class="news-item">' + esc(n.title || '') + (n.summary ? '<div class="eg-meta">' + esc(n.summary) + '</div>' : '') + '</div>';
        return u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;">' + inner + '</a>' : inner;
      }), 'مفيش أخبار مصرية في آخر تحديث للأخبار — لو نزل خبر مصري في المصادر هيظهر هنا تلقائيًا.');
    })
    .catch(function () {
      ['ntBox', 'leagueBox', 'newsBox'].forEach(function (id) {
        document.getElementById(id).innerHTML = '<div class="eg-empty">مشكلة في تحميل البيانات — جرب تحديث الصفحة 🙏</div>';
      });
      document.getElementById('egStamp').textContent = '';
    });
})();
</script>
</body>
</html>

name: Matches refresh (fixtures only)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matches-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh matches from public ESPN scoreboards
        run: python refresh_matches.py
      - name: Commit site/data.json if changed
        run: |
          git config user.name "edge-matches"
          git config user.email "edge-matches@users.noreply.github.com"
          ok=""
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 refresh_matches.py
            python3 scripts/resolve_predictions.py
            git add site/data.json
            if git diff --cached --quiet; then echo "matches already up to date"; ok=done; break; fi
            git commit -m "matches refresh (fixtures only)"
            if git push; then ok=done; break; fi
          done
          if [ -z "$ok" ]; then echo "push failed after retries"; exit 1; fi

name: Meta token validate (read-only)

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read-only Graph checks
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          set -e
          echo "== /me/accounts =="
          curl -sS "https://graph.facebook.com/v21.0/me/accounts?fields=id,name,instagram_business_account&access_token=${FB_PAGE_TOKEN}"
          echo
          echo "== /me/permissions =="
          curl -sS "https://graph.facebook.com/v21.0/me/permissions?access_token=${FB_PAGE_TOKEN}"
          echo

name: tsdb-cache
# Builds site/tsdb-cache.json from TheSportsDB's free API, server-side.
# The browser never calls the API (free tier: 30 requests/minute, no livescore).
# Terms applied: official endpoints only, paced calls, finished results only,
# artwork only where the API marks it CC.
on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'Max API requests this run (paced ~17/min)'
        required: false
        default: '200'

permissions:
  contents: write

concurrency:
  group: tsdb-cache
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build cache (one paced pass over the API)
        env:
          TSDB_KEY: ${{ secrets.TSDB_KEY }}
          TSDB_BUDGET: ${{ github.event.inputs.budget || '200' }}
        run: python3 scripts/build_tsdb_cache.py
      - name: Commit cache if changed
        run: |
          git config user.name "edge-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/tsdb-cache.json
          if git diff --cached --quiet; then echo "cache unchanged"; exit 0; fi
          git commit -m "tsdb: refresh cached national-team data (free tier)"
          for i in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort; echo "rebase conflict"; exit 1; fi
            if git push; then echo pushed; exit 0; fi
            sleep 5
          done
          echo "push failed after retries"; exit 1

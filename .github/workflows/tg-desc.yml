name: TG Fix channel description handle
on:
  workflow_dispatch:
jobs:
  tg-desc:
    runs-on: ubuntu-latest
    steps:
      - name: Replace only the mistaken YouTube handle in the channel description
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse
          base = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/"
          cid = os.environ["TELEGRAM_CHANNEL_ID"]
          def call(m, **kw):
              data = urllib.parse.urlencode(dict(chat_id=cid, **kw)).encode()
              return json.load(urllib.request.urlopen(urllib.request.Request(base + m, data=data), timeout=30))
          cur = (call("getChat").get("result") or {}).get("description") or ""
          print("before:", repr(cur))
          bad, good = "@andygmall", "@andygamall"
          if bad not in cur:
              raise SystemExit("typo not present, nothing changed")
          new = cur.replace(bad, good)
          print("setChatDescription ok:", call("setChatDescription", description=new).get("ok"))
          print("after:", repr((call("getChat").get("result") or {}).get("description")))
          PY

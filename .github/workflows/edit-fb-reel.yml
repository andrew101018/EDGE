name: Edit FB reel caption
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: FB reel video id
        required: true
      caption:
        description: new caption (use \n for new lines)
        required: true
permissions:
  contents: read
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      VID: ${{ inputs.video_id }}
      CAPTION: ${{ inputs.caption }}
    steps:
      - name: Edit
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, urllib.error
          G = "https://graph.facebook.com/v21.0"
          tok = os.environ["FB_PAGE_TOKEN"]; pid = os.environ["FB_PAGE_ID"]
          print("::add-mask::" + tok)
          def call(url, params=None):
              data = urllib.parse.urlencode(params).encode() if params is not None else None
              try:
                  t = urllib.request.urlopen(urllib.request.Request(url, data=data), timeout=60).read().decode()
              except urllib.error.HTTPError as e:
                  t = e.read().decode()
              return json.loads(t)
          pt = call(f"{G}/{pid}?fields=access_token&access_token={tok}").get("access_token", tok)
          print("::add-mask::" + pt)
          cap = os.environ["CAPTION"].replace("\\n", "\n")
          r = call(f"{G}/{os.environ['VID']}", {"description": cap, "access_token": pt})
          er = r.get("error") or {}
          print("result:", {"success": r.get("success"), "code": er.get("code"), "subcode": er.get("error_subcode"), "type": er.get("type")})
          if not r.get("success"): raise SystemExit(1)
          PY

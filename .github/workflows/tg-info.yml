name: TG Info (read-only)

on:
  workflow_dispatch:

permissions: {}

jobs:
  tg-info:
    runs-on: ubuntu-latest
    steps:
      - name: Show destination chat identity (no secrets)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getChat" --data-urlencode "chat_id=${TELEGRAM_CHANNEL_ID}" -o /tmp/c.json
          python3 -c "import json;r=json.load(open('/tmp/c.json'));c=r.get('result') or {};print('ok=',r.get('ok'),'type=',c.get('type'),'title=',c.get('title'),'username=',c.get('username'),'err=',r.get('description'))"

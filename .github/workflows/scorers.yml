name: scorers
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: build leaders
        run: |
          python - <<'EOF'
          import requests, json
          PRIORITY = ["egy.1","ksa.1","uefa.champions","eng.1","esp.1","ita.1","ger.1","fra.1"]
          LEAGUES = {"egy.1":"الدوري المصري","ksa.1":"الدوري السعودي","uefa.champions":"دوري أبطال أوروبا","eng.1":"الدوري الإنجليزي","esp.1":"الدوري الإسباني","ita.1":"الدوري الإيطالي","ger.1":"الدوري الألماني","fra.1":"الدوري الفرنسي"}
          TEAM_AR = {"Real Madrid":"ريال مدريد","Barcelona":"برشلونة","Liverpool":"ليفربول","Manchester City":"مانشستر سيتي","Manchester United":"مانشستر يونايتد","Chelsea":"تشيلسي","Arsenal":"أرسنال","Tottenham Hotspur":"توتنهام","Paris Saint-Germain":"باريس سان جيرمان","Bayern Munich":"بايرن ميونخ","Juventus":"يوفنتوس","Inter":"إنتر ميلان","AC Milan":"ميلان","Atlético Madrid":"أتلتيكو مدريد","Borussia Dortmund":"بوروسيا دورتموند","Napoli":"نابولي","Aston Villa":"أستون فيلا","Newcastle United":"نيوكاسل","Al Ahly":"الأهلي","Zamalek":"الزمالك","Pyramids FC":"بيراميدز","Al Hilal":"الهلال","Al Nassr":"النصر","Al Ittihad":"الاتحاد","Al Ahli":"الأهلي السعودي","Al Shabab":"الشباب","Al Fayha":"الفيحاء","Al Riyad":"الرياض","Al Wehda":"الوحدة","Al Qadsiah":"القادسية","Al Khaleej":"الخليج","Al Raed":"الرائد","Al Taawoun":"التعاون","Damac FC":"ضمك","Al Fateh":"الفتح","Ismaily":"الإسماعيلي","Al Masry":"المصري","Smouha":"سموحة","ENPPI":"إنبي","Galatasaray":"جالاطا سراي","Fenerbahçe":"فنربخشة","Beşiktaş":"بشكتاش","Benfica":"بنفيكا","Porto":"بورتو","Sporting CP":"سبورتينج لشبونة","Ajax":"أياكس","PSV Eindhoven":"آيندهوفن","Inter Miami":"إنتر ميامي","LAFC":"لوس أنجلوس FC","Chicago Fire":"شيكاغو فاير","Santos":"سانتوس"}
          leaders = {}
          for slug in PRIORITY:
              try:
                  d = requests.get(f"https://site.api.espn.com/apis/site/v2/sports/soccer/{slug}/scoreboard", timeout=10).json()
              except Exception:
                  continue
              agg = {}
              for ev in d.get("events", []):
                  try:
                      comp = ev["competitions"][0]
                      for c in comp.get("competitors", []):
                          for l in c.get("leaders", []):
                              if "goals" not in (l.get("name") or ""): continue
                              for p in l.get("leaders", []):
                                  a = p.get("athlete", {}) or {}
                                  try: g = int(float(p.get("value", 0) or 0))
                                  except Exception: g = 0
                                  key = a.get("id") or a.get("displayName")
                                  tn = (c.get("team", {}) or {}).get("displayName", "")
                                  if key not in agg or agg[key]["g"] < g:
                                      agg[key] = {"name": a.get("displayName", ""), "team": TEAM_AR.get(tn, tn), "g": g, "face": ((a.get("headshot", {}) or {}).get("href", ""))}
                  except Exception:
                      continue
              rows = sorted([v for v in agg.values() if v["g"] > 0], key=lambda x: -x["g"])[:15]
              if rows:
                  leaders[LEAGUES[slug]] = {"الهدافون 🏆 (الموسم الحالي)": [{"name": r["name"], "team": r["team"], "value": f"{r['g']} ⚽", "face": r["face"]} for r in rows]}
          path = "site/data.json"
          try:
              data = json.load(open(path, encoding="utf-8"))
          except Exception:
              data = {}
          data["leaders"] = leaders
          json.dump(data, open(path, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print("✅ leagues with leaders:", len(leaders))
          EOF
      - name: commit
        run: |
          git config user.name "edge-bot"
          git config user.email "edge-bot@users.noreply.github.com"
          git add site/data.json || true
          git diff --cached --quiet || git commit -m "update live leaders"
          git pull --rebase || true
          git push || echo "push failed"

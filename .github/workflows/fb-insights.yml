name: FB insights (read-only)

on:
  workflow_dispatch:

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only public engagement counts for Page posts and reels
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, urllib.error
          tok = os.environ["FB_PAGE_TOKEN"]
          print("::add-mask::" + tok)
          def get(path, params, t):
              params = dict(params, access_token=t)
              url = "https://graph.facebook.com/v21.0/" + path + "?" + urllib.parse.urlencode(params)
              try:
                  r = urllib.request.urlopen(url, timeout=60)
                  return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.loads(e.read().decode())
                  except Exception:
                      return e.code, {}
          code, d = get("me/accounts", {"fields": "id,name,access_token"}, tok)
          for p in (d.get("data", []) if code == 200 else []):
              ptok = p.get("access_token")
              if not ptok:
                  continue
              print("::add-mask::" + ptok)
              pid = p["id"]
              print("PAGE", pid, p.get("name"))
              c, d6 = get(pid + "/video_reels", {"fields": "id,created_time,length,likes.summary(true).limit(0),comments.summary(true).limit(0)", "limit": "25"}, ptok)
              print("reels", c, json.dumps(d6.get("error", ""))[:200])
              for x in d6.get("data", []):
                  print("REEL", x.get("created_time"), x.get("id"), x.get("length"), "likes", (x.get("likes") or {}).get("summary", {}).get("total_count"), "comments", (x.get("comments") or {}).get("summary", {}).get("total_count"))
              c, d4 = get(pid + "/published_posts", {"fields": "id,created_time,reactions.summary(true).limit(0),comments.summary(true).limit(0)", "limit": "25"}, ptok)
              print("posts", c, json.dumps(d4.get("error", ""))[:200])
              for x in d4.get("data", []):
                  print("POST", x.get("created_time"), x.get("id"), "react", (x.get("reactions") or {}).get("summary", {}).get("total_count"), "com", (x.get("comments") or {}).get("summary", {}).get("total_count"))
          PY

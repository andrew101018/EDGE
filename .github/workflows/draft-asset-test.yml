name: Draft asset privacy test (dummy)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Draft release asset round trip
        run: |
          set -e
          head -c 20000 /dev/urandom > dummy.bin
          sha256sum dummy.bin
          gh release create zz-dummy-draft dummy.bin --draft --title "dummy" --notes "temp" --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name=="zz-dummy-draft") | {id, draft, assets: [.assets[] | {id, name, browser_download_url, url}]}'
          ASSET_URL=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name=="zz-dummy-draft") | .assets[0].browser_download_url')
          ASSET_API=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name=="zz-dummy-draft") | .assets[0].url')
          echo "anonymous GET of browser_download_url:"
          curl -s -o /dev/null -w "%{http_code}\n" -L "$ASSET_URL"
          echo "anonymous GET of api asset url:"
          curl -s -o /dev/null -w "%{http_code}\n" -L -H "Accept: application/octet-stream" "$ASSET_API"
          echo "authenticated download via api:"
          curl -s -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o got.bin "$ASSET_API"
          sha256sum got.bin
        
      - name: Cleanup
        if: always()
        run: |
          gh release delete zz-dummy-draft --yes --repo "$GITHUB_REPOSITORY" || true
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq 'length'

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جولة الأسبوع | EDGE FOOTBALL</title>
<meta name="description" content="ملخص مباريات الجولة من كل الدوريات، مع فيديوهات EDGE وروابط التوقعات والفانتازي في صفحة واحدة.">
<link rel="canonical" href="https://andrew101018.github.io/EDGE/round.html">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f172a; color: #e2e8f0; font-family: Tahoma, Arial, sans-serif; min-height: 100vh; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 18px 14px 40px; }
  .brand { text-align: center; color: #fbbf24; font-weight: bold; font-size: .85em; letter-spacing: 1px; margin-bottom: 6px; }
  h1 { text-align: center; color: #fbbf24; font-size: 1.5em; margin-bottom: 4px; }
  .period { text-align: center; color: #94a3b8; font-size: .85em; margin-bottom: 4px; }
  .fresh { text-align: center; color: #64748b; font-size: .75em; margin-bottom: 18px; }
  .sec-title { color: #fbbf24; font-weight: bold; font-size: 1.1em; margin: 22px 0 10px; border-right: 3px solid #fbbf24; padding-right: 8px; }
  .league-block { background: #1e293b; border: 1px solid #334155; border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .league-name { background: #16213a; color: #fbbf24; font-weight: bold; font-size: .9em; padding: 8px 12px; }
  .mrow { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid #273449; font-size: .88em; }
  .mrow:first-of-type { border-top: none; }
  .team { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .team.away { justify-content: flex-end; text-align: left; }
  .team span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-logo { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }
  .center { flex-shrink: 0; text-align: center; min-width: 92px; }
  .score { color: #fbbf24; font-weight: bold; font-size: 1.05em; }
  .mtime { color: #e2e8f0; font-weight: bold; font-size: 1em; }
  .mstatus { color: #94a3b8; font-size: .75em; margin-top: 2px; }
  .live-dot { color: #ef4444; font-weight: bold; }
  .tv { color: #64748b; font-size: .72em; margin-top: 2px; }
  .empty { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; text-align: center; color: #94a3b8; font-size: .9em; }
  .video-box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; }
  .video-frame { position: relative; width: 100%; padding-top: 56.25%; border-radius: 8px; overflow: hidden; background: #000; }
  .video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video-link { display: block; text-align: center; margin-top: 10px; color: #fbbf24; text-decoration: none; font-size: .85em; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { display: block; text-align: center; background: #1e293b; border: 1px solid #fbbf24; color: #fbbf24; border-radius: 12px; padding: 12px 8px; text-decoration: none; font-weight: bold; font-size: .9em; }
  .btn:active { background: #273449; }
  .footer { text-align: center; margin-top: 28px; color: #64748b; font-size: .78em; }
  .footer b { color: #fbbf24; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">EDGE FOOTBALL · #EDGE</div>
  <h1>📅 جولة الأسبوع</h1>
  <div class="period" id="period"></div>
  <div class="fresh" id="fresh"></div>

  <div class="sec-title">⚽ ملخص الجولة</div>
  <div id="round"><div class="empty">ثانية بنحمل المباريات... ⏳</div></div>

  <div class="sec-title">🎬 فيديوهات EDGE</div>
  <div class="video-box">
    <div class="video-frame">
      <iframe src="https://www.youtube-nocookie.com/embed/videoseries?list=UUNLMhxo5HLbXt8lMdA3RBtg" title="فيديوهات EDGE على يوتيوب" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <a class="video-link" href="https://www.youtube.com/@andygamall" target="_blank" rel="noopener">كل الفيديوهات على يوتيوب ◀</a>
  </div>

  <div class="sec-title">🎯 شارك</div>
  <div class="btns">
    <a class="btn" href="index.html#predict">🎯 شارك بتوقعك</a>
    <a class="btn" href="index.html#fantasy">🧩 العب الفانتازي</a>
    <a class="btn" href="index.html#matches,tv">⚽ كل المباريات</a>
    <a class="btn" href="links.html">🔗 كل لينكات EDGE</a>
  </div>

  <div class="footer"><b>EDGE FOOTBALL · #EDGE</b><br>الكورة بتبدأ من هنا ⚽<br>andrew101018.github.io/EDGE</div>
</div>
<script>
(function () {
  var DAYS_AR = { Saturday: 'السبت', Sunday: 'الأحد', Monday: 'الاثنين', Tuesday: 'الثلاثاء', Wednesday: 'الأربعاء', Thursday: 'الخميس', Friday: 'الجمعة' };

  function cairoDay(d) {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'Africa/Cairo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
  }
  function fmtTime(iso) {
    var t = new Date(iso);
    if (isNaN(t)) return '';
    return new Intl.DateTimeFormat('ar-EG', { timeZone: 'Africa/Cairo', hour: 'numeric', minute: '2-digit' }).format(t);
  }
  function fmtStamp(s) {
    var p = (s || '').match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}) (AM|PM)$/);
    if (!p) return s || '';
    var hh = (+p[4]) % 12 + (p[6] === 'PM' ? 12 : 0);
    var d = new Date(Date.UTC(+p[1], +p[2] - 1, +p[3], hh - 2, +p[5]));
    return new Intl.DateTimeFormat('ar-EG', { timeZone: 'Africa/Cairo', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' }).format(d);
  }
  function escH(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function logo(src) { return src ? '<img class="t-logo" src="' + escH(src) + '" onerror="this.style.display=\'none\'">' : ''; }

  var now = new Date();
  var start = new Date(now.getTime() - 2 * 86400000);
  var end = new Date(now.getTime() + 5 * 86400000);
  var startDay = cairoDay(start), endDay = cairoDay(end);

  document.getElementById('period').textContent = 'من ' +
    new Intl.DateTimeFormat('ar-EG', { timeZone: 'Africa/Cairo', day: 'numeric', month: 'long' }).format(start) +
    ' لـ ' +
    new Intl.DateTimeFormat('ar-EG', { timeZone: 'Africa/Cairo', day: 'numeric', month: 'long' }).format(end) +
    ' (بتوقيت القاهرة)';

  fetch('site/data.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.matches_updated_at) {
        document.getElementById('fresh').textContent = 'آخر تحديث للمباريات: ' + fmtStamp(data.matches_updated_at);
      }
      var groups = [];
      (data.matches || []).forEach(function (g) {
        var items = (g.items || []).filter(function (m) {
          var t = Date.parse(m.date || '');
          if (Number.isNaN(t)) return false;
          var cd = cairoDay(new Date(t));
          return cd >= startDay && cd <= endDay;
        });
        if (items.length) {
          items.sort(function (a, b) { return Date.parse(a.date) - Date.parse(b.date); });
          groups.push({ league: g.league, items: items });
        }
      });
      var box = document.getElementById('round');
      if (!groups.length) {
        box.innerHTML = '<div class="empty">لا توجد مباريات مسجلة في هذه الفترة</div>';
        return;
      }
      box.innerHTML = groups.map(function (g) {
        var rows = g.items.map(function (m) {
          var center;
          if (m.state === 'in') {
            center = '<div class="score live-dot">🔴 ' + (m.hs != null ? m.hs + ' - ' + m.as : '') + '</div><div class="mstatus">مباشر</div>';
          } else if (m.state === 'post' || m.detail === 'FT') {
            center = '<div class="score">' + (m.hs != null ? m.hs + ' - ' + m.as : '') + '</div><div class="mstatus">انتهت</div>';
          } else {
            center = '<div class="mtime">' + escH(fmtTime(m.date)) + '</div><div class="mstatus">' +
              escH(DAYS_AR[m.day] || '') + (m.dateAr ? ' ' + escH(m.dateAr) : '') + '</div>';
          }
          var tv = m.tv ? '<div class="tv">📺 ' + escH(m.tv) + '</div>' : '';
          return '<div class="mrow">' +
            '<div class="team">' + logo(m.homeLogo) + '<span>' + escH(m.home) + '</span></div>' +
            '<div class="center">' + center + tv + '</div>' +
            '<div class="team away"><span>' + escH(m.away) + '</span>' + logo(m.awayLogo) + '</div>' +
            '</div>';
        }).join('');
        return '<div class="league-block"><div class="league-name">🏆 ' + escH(g.league) + '</div>' + rows + '</div>';
      }).join('');
    })
    .catch(function () {
      document.getElementById('round').innerHTML = '<div class="empty">تعذر تحميل المباريات الآن — جرب تحديث الصفحة</div>';
    });
})();
</script>
</body>
</html>

<style>
:root{--g:#0b5d3b;--g2:#e7f4ec;--y:#f2b705;--r:#c0392b;--t:#14201a;--m:#5d6b63;--b:#d9e2dc;--bg:#f6f8f6}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t);font-size:16px;line-height:1.5;padding-bottom:78px}
header{background:var(--g);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;flex:1}
header .logo{width:34px;height:34px;border-radius:50%;background:var(--y);color:var(--g);display:grid;place-items:center;font-weight:800}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--g2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:16px;white-space:nowrap}
.stat span{font-size:12px;color:var(--m)}
.stat.red{background:#fdeceb}.stat.red b{color:var(--r)}
button,select,input,textarea{font:inherit}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--b);border-radius:10px;background:#fff}
label{display:block;font-size:13px;color:var(--m);margin:8px 0 3px}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--g);color:#fff;font-weight:700;cursor:pointer}
.btn.alt{background:var(--g2);color:var(--g)}
.btn.wa{background:#25d366;color:#073b1a}
.btn.warn{background:#fdeceb;color:var(--r)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.pill.paid{background:#d6f0de;color:#0b5d3b}.pill.unpaid{background:#fdeceb;color:var(--r)}.pill.partial{background:#fff3cd;color:#8a6500}.pill.na{background:#eee;color:#666}
nav{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--b);display:flex;z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:13px;color:var(--m);cursor:pointer}
nav button.on{color:var(--g);font-weight:800;border-top:3px solid var(--g);padding-top:7px}
.pl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--b);flex-wrap:wrap}
.pl>div:first-child,.pl>span:first-child{flex:1 1 150px;min-width:0;overflow-wrap:anywhere}
.pl:last-child{border:0}
.pl .n{font-weight:700}.pl .s{font-size:13px;color:var(--m)}
.att{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--b)}
.att input{width:24px;height:24px}
dialog{border:0;border-radius:16px;padding:16px;width:min(94vw,460px);max-height:90vh;overflow:auto}
dialog::backdrop{background:#0008}
.empty{color:var(--m);text-align:center;padding:18px}
.toast{position:fixed;bottom:84px;inset-inline:16px;margin:auto;max-width:380px;background:#14201a;color:#fff;padding:10px 14px;border-radius:10px;text-align:center;z-index:9}
h2{font-size:17px;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
td:first-child,th:first-child{width:34%;overflow-wrap:anywhere}th{font-size:12.5px;white-space:nowrap}
.card{overflow-wrap:anywhere}
.att{flex-wrap:wrap}.att .grow{min-width:0;flex:1 1 120px;overflow-wrap:anywhere}
th,td{padding:6px 4px;border-bottom:1px solid var(--b);text-align:right}
.note{font-size:12px;color:var(--m)}
.search{margin-bottom:8px}.gt td,.gt th{font-size:13px}.warnbox{background:#fff3cd;border:1px solid #f2d27a;color:#6b4e00}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--y);outline-offset:1px}.btn,nav button{min-height:44px}.sm{min-height:36px}
.rate{display:flex;gap:6px}.rate label{flex:1;margin:0;border:1px solid var(--b);border-radius:10px;text-align:center;padding:9px 0;font-size:16px;color:var(--t);cursor:pointer;background:#fff}.rate input{position:absolute;opacity:0;width:1px;height:1px}.rate label:has(input:checked){background:var(--g);color:#fff;border-color:var(--g);font-weight:700}.rate label:has(input:focus-visible){outline:3px solid var(--y)}canvas#cv{width:100%;border-radius:12px;border:1px solid var(--b);display:block}
@media print{header,nav,.noprint{display:none!important}body{background:#fff;padding:0}.card{border:0}}
</style>

<body>
<header><div class="logo">ك</div><h1 id="title">دفتر الكابتن</h1><button class="btn alt sm noprint" id="setBtn">الإعدادات</button></header>
<main id="app"></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<script>
"use strict";
/* ============ المنطق (دوال نقية قابلة للاختبار) ============ */
const AR_MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const DK={
  toWestern(s){return String(s==null?"":s).replace(/[\u0660-\u0669]/g,d=>d.charCodeAt(0)-0x660).replace(/[\u06F0-\u06F9]/g,d=>d.charCodeAt(0)-0x6F0)},
  normPhone(s){
    let d=DK.toWestern(s).replace(/[^\d]/g,"");
    if(d.startsWith("0020"))d=d.slice(4);else if(d.startsWith("020")&&d.length===13)d=d.slice(3);else if(d.startsWith("20")&&d.length===12)d=d.slice(2);else if(d.startsWith("0"))d=d.slice(1);
    return /^1[0125]\d{8}$/.test(d)?"20"+d:null;
  },
  num(s){const n=parseFloat(DK.toWestern(s).replace(",","."));return isFinite(n)?n:NaN},
  monthKey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")},
  monthLabel(k){const [y,m]=k.split("-");return AR_MONTHS[+m-1]+" "+y},
  addMonths(k,n){let [y,m]=k.split("-").map(Number);m+=n-1;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+"-"+String(m+1).padStart(2,"0")},
  monthsBetween(a,b){const out=[];let k=a;while(k<=b&&out.length<240){out.push(k);k=DK.addMonths(k,1)}return out},
  due(p,month){return p.active&&month>=p.start?p.fee:0},
  paid(st,pid,month){return st.payments.filter(x=>x.pid===pid&&x.month===month).reduce((s,x)=>s+x.amount,0)},
  monthStatus(st,p,month){
    const due=DK.due(p,month);if(!due)return{due:0,paid:0,remaining:0,status:"na"};
    const paid=DK.paid(st,p.id,month),remaining=Math.max(0,due-paid);
    return{due,paid,remaining,status:remaining===0?"paid":paid>0?"partial":"unpaid"};
  },
  arrears(st,p,upto){ // كل الشهور من البداية حتى الشهر المحدد
    if(!p.active||upto<p.start)return{total:0,months:[]};
    const months=[];let total=0;
    for(const m of DK.monthsBetween(p.start,upto)){const r=DK.monthStatus(st,p,m).remaining;if(r>0){months.push(m);total+=r}}
    return{total,months};
  },
  summary(st,month){
    let expected=0,collected=0,paidN=0,lateN=0;
    for(const p of st.players){const s=DK.monthStatus(st,p,month);if(s.status==="na")continue;expected+=s.due;collected+=Math.min(s.paid,s.due);if(s.status==="paid")paidN++;else lateN++}
    return{expected,collected,outstanding:expected-collected,paidN,lateN,active:st.players.filter(p=>p.active).length};
  },
  attendanceRate(st,pid,month,group){
    const ss=st.sessions.filter(s=>s.date.startsWith(month)&&(!group||s.group===group));
    const pg=DK.playerGroup(st,pid);const mine=ss.filter(s=>s.group===""||s.group===pg);
    if(!mine.length)return null;
    return Math.round(100*mine.filter(s=>s.present.includes(pid)).length/mine.length);
  },
  groupNames(st){const a=(st.academy.groups||[]).map(g=>g.name);for(const p of st.players)if(p.group&&!a.includes(p.group))a.push(p.group);return a},
  groupFee(st,name){const g=(st.academy.groups||[]).find(x=>x.name===name);return g&&g.fee>0?g.fee:0},
  parseGroups(text){const out=[],errors=[],seen=new Set();String(text||"").split(/\r?\n/).forEach((line,i)=>{line=line.trim();if(!line)return;const c=line.split(/\t|,|،|;/).map(x=>x.trim());const name=c[0];let fee=0;if(c[1]){fee=DK.num(c[1]);if(!(fee>0)){errors.push((i+1)+": اشتراك غير صحيح ("+name+")");return}}if(!name){errors.push((i+1)+": اسم المجموعة فاضي");return}if(seen.has(name)){errors.push((i+1)+": مكرر ("+name+")");return}seen.add(name);out.push({name,fee})});return{groups:out,errors}},
  groupSummary(st,month){const names=DK.groupNames(st).concat([""]);const rows=[];for(const g of names){let n=0,expected=0,collected=0,late=0;for(const p of st.players){if((p.group||"")!==g||!p.active)continue;n++;const m=DK.monthStatus(st,p,month);if(m.status==="na")continue;expected+=m.due;collected+=Math.min(m.paid,m.due);if(m.status!=="paid")late++}if(n)rows.push({group:g,n,expected,collected,outstanding:expected-collected,late})}return rows},
  groupAttendance(st,month){const out=[];for(const g of DK.groupNames(st)){const ids=st.players.filter(p=>p.active&&p.group===g).map(p=>p.id);const ss=st.sessions.filter(x=>x.date.startsWith(month)&&(x.group===""||x.group===g));if(!ids.length||!ss.length)continue;let pres=0;for(const x of ss)pres+=x.present.filter(i=>ids.includes(i)).length;out.push({group:g,sessions:ss.length,members:ids.length,rate:Math.round(100*pres/(ss.length*ids.length))})}return out},
  SKILLS:[["pass","التمرير"],["ctrl","التحكم بالكرة"],["speed","السرعة"],["fit","اللياقة"],["team","الانضباط وروح الفريق"]],
  rating(st,pid,month){return st.ratings.find(x=>x.pid===pid&&x.month===month)||null},
  prevRating(st,pid,month){return st.ratings.filter(x=>x.pid===pid&&x.month<month).sort((a,b)=>b.month.localeCompare(a.month))[0]||null},
  stars(n){return "★".repeat(n)+"☆".repeat(5-n)},
  cardText(st,p,month){const r=DK.rating(st,p.id,month);if(!r)return null;const pr=DK.prevRating(st,p.id,month),att=DK.attendanceRate(st,p.id,month);
    const lines=DK.SKILLS.filter(([k])=>r.s[k]).map(([k,l])=>{const d=pr&&pr.s[k]?r.s[k]-pr.s[k]:0;return l+": "+DK.stars(r.s[k])+(d>0?" (↑ تحسن)":d<0?" (↓)":"")});
    return "تقرير تطور اللاعب "+p.name+(p.group?" ("+p.group+")":"")+"\n"+(st.academy.name||"الأكاديمية")+" - شهر "+DK.monthLabel(month)+"\n"+lines.join("\n")+(att==null?"":"\nنسبة الحضور: "+att+"%")+(r.note?"\nملاحظة الكابتن: "+r.note:"")+"\nشكرًا لمتابعتكم.";},
  playerGroup(st,pid){const p=st.players.find(x=>x.id===pid);return p?p.group:""},
  reminderText(st,p,month){
    const a=DK.arrears(st,p,month),acad=st.academy.name||"الأكاديمية";
    const ms=a.months.map(DK.monthLabel).join("، ");
    return "السلام عليكم ولي أمر "+p.name+"،\nتذكير ودّي من "+acad+": المتبقي من الاشتراك "+a.total+" جنيه عن شهر "+ms+".\nلو تم السداد تجاهل الرسالة، وشكرًا لتعاونك."+(st.academy.pay?"\nطريقة الدفع: "+st.academy.pay:"");
  },
  receiptText(st,p,pay){
    return "إيصال استلام من "+(st.academy.name||"الأكاديمية")+"\nاللاعب: "+p.name+"\nالمبلغ: "+pay.amount+" جنيه\nعن شهر: "+DK.monthLabel(pay.month)+"\nالتاريخ: "+pay.date+"\nشكرًا لكم.";
  },
  waLink(phone,text){const n=DK.normPhone(phone);return n?"https://wa.me/"+n+"?text="+encodeURIComponent(text):null},
  csv(st,month){
    const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
    const rows=[["اللاعب","المجموعة","الهاتف","الاشتراك","المدفوع","المتبقي","الحالة","المتأخرات حتى الشهر"]];
    const lab={paid:"مدفوع",unpaid:"غير مدفوع",partial:"جزئي",na:"غير مشترك"};
    for(const p of st.players){const s=DK.monthStatus(st,p,month);rows.push([p.name,p.group,p.phone,s.due,s.paid,s.remaining,lab[s.status],DK.arrears(st,p,month).total])}
    return "\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n");
  },
  validate(o){
    if(!o||typeof o!=="object")return null;
    const st={academy:{name:"",fee:200,pay:"",...(o.academy||{})},players:[],payments:[],sessions:[],ratings:[]};
    st.academy.groups=(Array.isArray(st.academy.groups)?st.academy.groups:[]).filter(g=>g&&typeof g.name==="string"&&g.name.trim()).map(g=>({name:g.name.trim(),fee:isFinite(g.fee)&&+g.fee>0?+g.fee:0}));
    for(const p of Array.isArray(o.players)?o.players:[]){if(p&&typeof p.id==="string"&&typeof p.name==="string"&&/^\d{4}-\d{2}$/.test(p.start)&&isFinite(p.fee))st.players.push({id:p.id,name:p.name,phone:String(p.phone||""),group:String(p.group||""),fee:+p.fee,start:p.start,active:p.active!==false})}
    const ids=new Set(st.players.map(p=>p.id));
    for(const x of Array.isArray(o.payments)?o.payments:[]){if(x&&ids.has(x.pid)&&isFinite(x.amount)&&x.amount>0&&/^\d{4}-\d{2}$/.test(x.month))st.payments.push({id:String(x.id||DK.uid()),pid:x.pid,month:x.month,amount:+x.amount,date:String(x.date||"")})}
    for(const s of Array.isArray(o.sessions)?o.sessions:[]){if(s&&/^\d{4}-\d{2}-\d{2}$/.test(s.date)&&Array.isArray(s.present))st.sessions.push({id:String(s.id||DK.uid()),date:s.date,group:String(s.group||""),present:s.present.filter(i=>ids.has(i))})}
    for(const r of Array.isArray(o.ratings)?o.ratings:[]){if(!r||!ids.has(r.pid)||!/^\d{4}-\d{2}$/.test(r.month)||!r.s||typeof r.s!=="object")continue;const sk={};for(const [k] of DK.SKILLS){const v=+r.s[k];if(v>=1&&v<=5&&Number.isInteger(v))sk[k]=v}if(!Object.keys(sk).length)continue;st.ratings=st.ratings.filter(x=>!(x.pid===r.pid&&x.month===r.month));st.ratings.push({id:String(r.id||DK.uid()),pid:r.pid,month:r.month,s:sk,note:String(r.note||"").slice(0,300)})}
    return st;
  },
  parseImport(text,defFee,defStart){
    const rows=[],errors=[],seen=new Set();
    String(text||"").split(/\r?\n/).forEach((line,i)=>{
      line=line.trim();if(!line)return;
      const c=line.split(/\t|,|،|;/).map(x=>x.trim());
      if(i===0&&/^(الاسم|اسم|name)/i.test(c[0]))return;
      const name=c[0],ph=c[1]||"",group=c[2]||"";
      let fee=c[3]?DK.num(c[3]):defFee;
      let start=c[4]?DK.toWestern(c[4]).slice(0,7):defStart;
      if(!name){errors.push((i+1)+": الاسم فاضي");return}
      if(ph&&!DK.normPhone(ph)){errors.push((i+1)+": رقم غير صحيح ("+name+")");return}
      if(!(fee>0)){errors.push((i+1)+": اشتراك غير صحيح ("+name+")");return}
      if(!/^\d{4}-\d{2}$/.test(start)||+start.slice(5)<1||+start.slice(5)>12){errors.push((i+1)+": شهر البداية لازم يبقى مثل 2026-11 ("+name+")");return}
      const key=name+"|"+DK.normPhone(ph);if(seen.has(key)){errors.push((i+1)+": مكرر ("+name+")");return}seen.add(key);
      rows.push({name,phone:ph,group,fee,start});
    });
    return{rows,errors};
  },
  lateListText(st,month){
    const L=st.players.filter(p=>p.active).map(p=>({p,a:DK.arrears(st,p,month)})).filter(x=>x.a.total>0).sort((a,b)=>b.a.total-a.a.total);
    return (st.academy.name||"الأكاديمية")+" - المتأخرون حتى "+DK.monthLabel(month)+"\n"+L.map((x,i)=>(i+1)+". "+x.p.name+" ("+x.p.group+"): "+x.a.total+" جنيه").join("\n")+"\nالإجمالي: "+L.reduce((s,x)=>s+x.a.total,0)+" جنيه";
  },
  uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)},
  today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
};

function wrapText(ctx,text,maxW){const out=[];for(const para of String(text).split("\n")){let line="";for(const w of para.split(/\s+/)){const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t}out.push(line)}return out}
function drawCard(p,month){const r=DK.rating(state,p.id,month);if(!r)return null;const pr=DK.prevRating(state,p.id,month),att=DK.attendanceRate(state,p.id,month);
  const W=720,sk=DK.SKILLS.filter(([k])=>r.s[k]);const c=document.createElement("canvas");c.width=W;const ctx=c.getContext("2d");ctx.direction="rtl";ctx.textAlign="right";
  ctx.font="26px system-ui,Tahoma,Arial,sans-serif";const noteLines=r.note?wrapText(ctx,r.note,W-100):[];
  const H=300+sk.length*74+(att==null?0:70)+(noteLines.length?60+noteLines.length*38:0)+70;c.height=H;ctx.direction="rtl";ctx.textAlign="right";
  ctx.fillStyle="#f6f8f6";ctx.fillRect(0,0,W,H);ctx.fillStyle="#0b5d3b";ctx.fillRect(0,0,W,210);
  ctx.fillStyle="#f2b705";ctx.beginPath();ctx.arc(W-70,70,38,0,7);ctx.fill();ctx.fillStyle="#0b5d3b";ctx.font="bold 40px system-ui,Tahoma,Arial,sans-serif";ctx.textAlign="center";ctx.fillText("ك",W-70,84);ctx.textAlign="right";
  ctx.fillStyle="#fff";ctx.font="28px system-ui,Tahoma,Arial,sans-serif";ctx.fillText(state.academy.name||"الأكاديمية",W-130,78);
  ctx.font="bold 46px system-ui,Tahoma,Arial,sans-serif";ctx.fillText(p.name,W-40,150);ctx.font="24px system-ui,Tahoma,Arial,sans-serif";ctx.fillStyle="#d7ecdf";ctx.fillText((p.group?p.group+" · ":"")+"تقرير شهر "+DK.monthLabel(month),W-40,190);
  let y=250;for(const [k,l] of sk){const v=r.s[k],d=pr&&pr.s[k]?v-pr.s[k]:0;ctx.fillStyle="#14201a";ctx.font="bold 28px system-ui,Tahoma,Arial,sans-serif";ctx.fillText(l,W-40,y);
    const bx=40,bw=380,by=y-24;ctx.fillStyle="#d9e2dc";ctx.fillRect(bx,by,bw,24);ctx.fillStyle=v>=4?"#0b5d3b":v>=3?"#f2b705":"#c0392b";ctx.fillRect(bx,by,bw*v/5,24);
    ctx.textAlign="left";ctx.fillStyle="#14201a";ctx.font="bold 26px system-ui,Tahoma,Arial,sans-serif";ctx.fillText(v+"/5"+(d>0?"  ↑":d<0?"  ↓":""),bx+bw+16,y);ctx.textAlign="right";y+=74}
  if(att!=null){ctx.fillStyle="#e7f4ec";ctx.fillRect(30,y-30,W-60,56);ctx.fillStyle="#0b5d3b";ctx.font="bold 28px system-ui,Tahoma,Arial,sans-serif";ctx.fillText("نسبة الحضور هذا الشهر: "+att+"%",W-50,y+8);y+=70}
  if(noteLines.length){ctx.fillStyle="#5d6b63";ctx.font="bold 24px system-ui,Tahoma,Arial,sans-serif";ctx.fillText("ملاحظة الكابتن",W-40,y+10);ctx.fillStyle="#14201a";ctx.font="26px system-ui,Tahoma,Arial,sans-serif";noteLines.forEach((t,i)=>ctx.fillText(t,W-40,y+52+i*38));y+=60+noteLines.length*38}
  ctx.fillStyle="#5d6b63";ctx.font="20px system-ui,Tahoma,Arial,sans-serif";ctx.textAlign="center";ctx.fillText("دفتر الكابتن",W/2,H-28);return c}
function cardForm(id){const p=state.players.find(x=>x.id===id);if(!p)return;const c=drawCard(p,month);
  if(!c){openDlg(`<h2>بطاقة ${esc(p.name)}</h2><p class="note">لا يوجد تقييم لشهر ${DK.monthLabel(month)} بعد.</p><div class="row"><button class="btn grow" data-rate="${id}">أضف تقييم</button><button class="btn alt" data-close>إغلاق</button></div>`);return}
  openDlg(`<h2>بطاقة ${esc(p.name)}</h2><canvas id="cv"></canvas><p class="note">البطاقة بدون أي مبالغ مالية. ابعتها لولي الأمر بنفسك.</p><div class="row" style="margin-top:8px"><button class="btn wa grow" data-cshare="${id}">مشاركة الصورة</button><button class="btn alt" data-cwa="${id}">واتساب نص</button></div><div class="row" style="margin-top:8px"><button class="btn alt" data-csave="${id}">حفظ كصورة</button><button class="btn alt" data-rate="${id}">تعديل التقييم</button><button class="btn alt" data-close>إغلاق</button></div>`);
  const cv=$("#cv");cv.width=c.width;cv.height=c.height;cv.getContext("2d").drawImage(c,0,0)}
function cardBlob(id){return new Promise(res=>{const p=state.players.find(x=>x.id===id),c=p&&drawCard(p,month);c?c.toBlob(res,"image/png"):res(null)})}
async function cardShare(id,save){const p=state.players.find(x=>x.id===id),b=await cardBlob(id);if(!b)return;const name="بطاقة-"+p.name+"-"+month+".png";const file=new File([b],name,{type:"image/png"});
  if(!save&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e&&e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast("تم حفظ الصورة")}
function openWA(phone,text){const l=DK.waLink(phone,text);if(!l){toast("رقم ولي الأمر غير مسجل أو غير صحيح");return}window.open(l,"_blank","noopener")}
function settings(){
  openDlg(`<h2>إعدادات الأكاديمية</h2><form id="sf"><label>اسم الأكاديمية</label><input name="name" value="${esc(state.academy.name)}"><label>الاشتراك الافتراضي (جنيه)</label><input name="fee" inputmode="decimal" value="${state.academy.fee}"><label>طريقة الدفع تظهر في التذكير (اختياري)</label><input name="pay" value="${esc(state.academy.pay||"")}" placeholder="مثال: انستاباي أو فودافون كاش على رقم..."><label>المجموعات واشتراكها (سطر لكل مجموعة: الاسم, الاشتراك)</label><textarea name="groups" rows="4" placeholder="تحت 10, 250&#10;تحت 12, 300">${esc((state.academy.groups||[]).map(g=>g.name+(g.fee?", "+g.fee:"")).join("\n"))}</textarea><p class="note">اللاعب الجديد يأخذ اشتراك مجموعته تلقائيًا.</p><p class="note" id="serr" style="color:var(--r);white-space:pre-line"></p><div class="row" style="margin-top:12px"><button class="btn grow" type="submit">حفظ</button><button class="btn alt" type="button" data-close>إلغاء</button></div></form><hr style="border:0;border-top:1px solid var(--b);margin:14px 0"><div class="row"><button class="btn alt sm" id="privB">الخصوصية وبياناتك</button>${deferredInstall?`<button class="btn alt sm" id="instB">تثبيت التطبيق</button>`:""}</div><p class="note">للتثبيت على الموبايل: من قائمة المتصفح اختر "إضافة إلى الشاشة الرئيسية".</p>`);
  $("#sf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),fee=DK.num(f.get("fee")),gp=DK.parseGroups(f.get("groups"));if(gp.errors.length){$("#serr").textContent="صحح:\n"+gp.errors.join("\n");return}state.academy={name:String(f.get("name")).trim(),fee:fee>0?fee:200,pay:String(f.get("pay")).trim(),groups:gp.groups};save();close();render()};
}
function privacy(){openDlg(`<h2>الخصوصية وبياناتك</h2><ul style="padding-inline-start:18px;line-height:1.9"><li>كل بيانات اللاعبين محفوظة على جهازك فقط، ولا تُرسل لأي سيرفر ولا نجمع أي بيانات عنك.</li><li>رسائل واتساب بتفتح تطبيق واتساب عندك برسالة جاهزة، وإنت اللي بتضغط إرسال.</li><li>لو مسحت بيانات المتصفح أو غيرت الموبايل، البيانات بتضيع. خد نسخة احتياطية كل أسبوع واحفظها في مكان آمن.</li><li>ملف النسخة الاحتياطية فيه أسماء وأرقام ولي الأمر، فمتبعتوش لحد غريب.</li><li>بطاقة تطور اللاعب بتتبعت لولي الأمر بإرادتك فقط (واتساب أو صورة تحفظها). فيها اسم الطفل وتقييمه وحضوره، بدون أي مبالغ مالية. متشاركهاش علنًا.</li><li>الأرقام والأسماء حساسة، خصوصًا الأطفال. سجّل اللي محتاجه بس.</li></ul><div class="row"><button class="btn grow" data-close>تمام</button></div>`)}
let deferredInstall=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e});
function download(name,type,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
/* ============ أحداث ============ */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-t]");if(!t)return;const d=t.dataset;
  if(d.t){tab=d.t;render();window.scrollTo(0,0)}
  else if(d.m){month=DK.addMonths(month,+d.m);render()}
  else if(t.id==="addP")playerForm();
  else if(t.id==="impP")importForm();
  else if(t.id==="copyLate"){const tx=DK.lateListText(state,month);(navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).then(()=>toast("تم النسخ")).catch(()=>{window.prompt("انسخ القائمة:",tx)})}
  else if(d.edit)playerForm(d.edit);
  else if(d.pay)payForm(d.pay);
  else if(d.rate)rateForm(d.rate);
  else if(d.card)cardForm(d.card);
  else if(d.cshare)cardShare(d.cshare,false);
  else if(d.csave)cardShare(d.csave,true);
  else if(d.cwa){const p=state.players.find(x=>x.id===d.cwa);const tx=p&&DK.cardText(state,p,month);if(tx)openWA(p.phone,tx)}
  else if(d.wa){const p=state.players.find(x=>x.id===d.wa);if(p)openWA(p.phone,DK.reminderText(state,p,month))}
  else if(d.rc){const x=state.payments.find(y=>y.id===d.rc),p=x&&state.players.find(y=>y.id===x.pid);if(p)openWA(p.phone,DK.receiptText(state,p,x))}
  else if(d.undo){const x=state.payments.find(y=>y.id===d.undo);if(x&&confirm("إلغاء هذه الدفعة؟")){state.payments=state.payments.filter(y=>y.id!==d.undo);save();render();payForm(x.pid)}}
  else if(d.del){if(confirm("حذف اللاعب وكل دفعاته وحضوره؟ لا يمكن التراجع.")){state.players=state.players.filter(p=>p.id!==d.del);state.payments=state.payments.filter(p=>p.pid!==d.del);state.ratings=state.ratings.filter(r=>r.pid!==d.del);state.sessions.forEach(s=>s.present=s.present.filter(i=>i!==d.del));save();close();render()}}
  else if(t.hasAttribute("data-close"))close();
  else if(t.id==="setBtn")settings();
  else if(t.id==="privB")privacy();
  else if(t.id==="instB"&&deferredInstall){deferredInstall.prompt();deferredInstall=null;close()}
  else if(t.id==="prt")window.print();
  else if(t.id==="csv")download("تقرير-"+month+".csv","text/csv;charset=utf-8",DK.csv(state,month));
  else if(t.id==="bak"){localStorage.setItem(LB,String(Date.now()));download("نسخة-دفتر-الكابتن-"+DK.today()+".json","application/json",JSON.stringify(state));render()}
  else if(t.id==="rst")$("#file").click();
});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#q");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="fg"){filterGroup=t.value;render()}
  else if(t.id==="ad"){if(t.value){attDate=t.value;render()}}
  else if(t.id==="ag"){attGroup=t.value;render()}
  else if(t.dataset&&t.dataset.att){
    let s=state.sessions.find(x=>x.date===attDate&&x.group===attGroup);
    if(!s){s={id:DK.uid(),date:attDate,group:attGroup,present:[]};state.sessions.push(s)}
    s.present=s.present.filter(i=>i!==t.dataset.att);if(t.checked)s.present.push(t.dataset.att);
    save();
  }else if(t.id==="file"&&t.files[0]){
    const r=new FileReader();r.onload=()=>{try{const s=DK.validate(JSON.parse(r.result));if(!s||!Array.isArray(JSON.parse(r.result).players))throw 0;if(confirm("سيتم استبدال البيانات الحالية بالنسخة ("+s.players.length+" لاعب). متابعة؟")){state=s;save();render();toast("تم الاسترجاع")}}catch(x){toast("الملف غير صالح")}};r.readAsText(t.files[0]);t.value="";
  }
});
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
